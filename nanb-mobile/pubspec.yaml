name: nanb_chat
description: "NANb Chat — privacy-focused secure messenger (mobile client)."
publish_to: 'none'
version: 1.0.0+54

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  # Network-change detection: kicks a fresh WebSocket reconnect on a
  # WiFi<->cellular handoff or regained connectivity, so a half-open socket
  # left on a gone interface doesn't silently swallow sends until the next
  # server ping timeout. See lib/core/network/connectivity_reconnector.dart.
  connectivity_plus: ^6.1.0
  # SOCKS5 client so the app can route HTTP + the WebSocket through a local
  # Tor proxy (e.g. Orbot's 127.0.0.1:9050) without relying on an OS-level
  # transparent proxy. See lib/core/network/socks_proxy.dart.
  socks5_proxy: ^1.0.4
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  bip39: ^1.0.6
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  archive: ^4.0.9
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  flutter_sound: ^9.0.0
  just_audio: ^0.9.40
  open_filex: ^4.5.0
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.0

  # Local plugin: native CoreCrypto MLS channel. A plugin (not a manual
  # MainActivity registration) so it auto-attaches to the FCM background
  # isolate's engine too.
  nanb_crypto:
    path: nanb_crypto
  permission_handler: ^12.0.3
  gal: ^2.3.2
  flutter_webrtc: ^1.5.1
  # Opens the hosted Privacy Policy / Data-deletion pages in the external
  # browser from Settings → About. The App Store and Play both want a reachable
  # privacy-policy URL; this also surfaces it in-app.
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  # Browser APIs (IndexedDB, WebCrypto) for the web client's platform layer.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation. Source art lives in assets/icon/ (the Chat
# lock-bubble logo). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # The source art is already a complete, dark-background icon, so the Android
  # adaptive foreground is the full logo and the background is the logo's own
  # navy (#050C1A). The launcher mask then only ever crops that matching navy
  # border — never the bubble/lock artwork, which sits inside the safe zone.
  adaptive_icon_background: "#050C1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    # The Chat app mark, shown in-app on neutral loading screens — e.g. the
    # chat thread's "reconnecting" state.
    - assets/icon/app_icon_foreground.png
    # Bundled sticker packs: Microsoft's Fluent Emoji (3D), MIT-licensed — the
    # license text ships alongside as the MIT terms require. A directory entry
    # is not recursive, so each pack folder is listed; a new pack needs a line.
    - assets/stickers/LICENSE-FluentEmoji.txt
    - assets/stickers/faces/
    - assets/stickers/reactions/
    - assets/stickers/fun/

  # Fonts BUNDLED locally so the app never fetches them from Google's CDN at
  # runtime. Previously google_fonts fetched IBM Plex Mono + Inter on first
  # launch using the device's real IP, outside Tor — a privacy leak. Both fonts
  # are SIL OFL (licenses in assets/fonts/OFL-*.txt). Inter is the variable font
  # (all weights in one file); IBM Plex Mono ships static weights.
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    # Bundled so the WEB build never fetches Roboto from fonts.gstatic.com (that
    # request would leak the visitor's IP to Google at page load). Apache-2.0.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
